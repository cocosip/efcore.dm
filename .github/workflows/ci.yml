name: CI

# The offline rows of the matrix in docs/branching-and-release.md: nothing here needs a Dameng
# instance. The live rows are not wired until one is reachable, and a release decision records
# what live verification did not cover.

on:
  push:
    branches:
      - dev
      - master
      - hotfix/**
    tags:
      - v*
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests and acceptance dry run
    # Windows is the platform every command in the README was verified on. A Linux job joins with
    # the live matrix, where its result can be read, rather than turning an unverified native asset
    # into a red build here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # A warning is a failed build, so no continuation flag is needed here.
      - name: Build
        run: dotnet build DM.EntityFrameworkCore.slnx -c Release

      - name: Unit and SQL shape tests
        run: dotnet test DM.EntityFrameworkCore.slnx -c Release --no-build

      - name: Acceptance dry run
        run: dotnet run --project samples/DmProviderValidation -c Release --no-build -- --dry-run

  pack:
    name: Package smoke test
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack, restore in an isolated cache and run the consumer
        shell: pwsh
        run: ./scripts/package-smoke.ps1
